apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: microservices
data: 
  application-dev.yml: |
    spring:
      datasource:
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: update
        open-in-view: false
        show-sql: true
        properties:
          hibernate:
            format_sql: true

    management:
      endpoint:
        gateway:
          enabled: true
      endpoints:
        web:
          exposure:
            include: health,info, gateway

  order-service.yml: |
    spring:
      datasource:
        url: ${ORDER_DB_URL}
        username: ${ORDER_DB_USERNAME}
        password: ${ORDER_DB_PASSWORD}