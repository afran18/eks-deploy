apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: microservices
data:
  application-dev.yml: |
    spring:
      datasource:
        driver-class-name: org.postgresql.Driver
      jpa:
        hibernate:
          ddl-auto: update
        open-in-view: false
        show-sql: true
        properties:
          hibernate:
            format_sql: true

    management:
      endpoint:
        gateway:
          enabled: true
      endpoints:
        web:
          exposure:
            include: health,info,gateway

  auth-service.yml: |
    spring:
      datasource:
        url: ${AUTH_DB_URL}
        username: ${AUTH_DB_USERNAME}
        password: ${AUTH_DB_PASSWORD}

    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000